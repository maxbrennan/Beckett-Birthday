syntax = "proto3";
package birthday;

enum AuthLevel {
  AUTH_LEVEL_NONE   = 0;
  AUTH_LEVEL_PLAYER = 1;
  AUTH_LEVEL_ADMIN  = 2;
}

message StateUpdate          { string json = 1; }
message StateUpdateAck       {}
message DistRegisterAck      { string upload_token = 1; }
message DistUploadAck        {}
message DistCompleteAck      {}
message DistStateEditSaveAck {}
message DistReplaceCompleteAck {}
message DistUndeployAck      {}
message WinText              { string text = 1; }
message AuthChallenge        { bytes challenge = 1; AuthLevel level = 2; }
message StateRequest         { string uuid = 1; }
message StateRequestRejected { string reason = 1; }

message PasswordAuthResponse {
  string username   = 1;
  string password   = 2;
  bytes  public_key = 3;
}

message KeyAuthResponse {
  string uuid               = 1;
  bytes  challenge_response = 2;
}

message AuthResponse {
  oneof method {
    PasswordAuthResponse password = 1;
    KeyAuthResponse      key      = 2;
  }
}

message PasswordAuthResult {
  bool      success = 1;
  AuthLevel level   = 2;
  string    uuid    = 3;
}

message KeyAuthResult {
  bool      success = 1;
  AuthLevel level   = 2;
}

message AuthResult {
  oneof result {
    PasswordAuthResult password = 1;
    KeyAuthResult      key      = 2;
  }
}

message DistRegister { string uuid = 1; string platform = 2; }
message DistUpload {
  string uuid        = 1;
  string filename    = 2;
  bytes  contents    = 3;
  uint32 chunk_index = 4;
  bool   is_last     = 5;
}
message DistUndeploy        { string uuid = 1; }
message DistList            {}
message DistComplete         { string uuid = 1; string filename = 2; string win_text = 3; }
message DistStateEdit        { string uuid = 1; }
message DistStateEditSave    { string uuid = 1; string json = 2; }
message DistStateEditPayload { string uuid = 1; string json = 2; }
message DistReplaceComplete  { string new_uuid = 1; string old_uuid = 2; string filename = 3; }

message DistListEntry {
  string uuid     = 1;
  string filename = 2;
  string platform = 3;
}
message DistListResult { repeated DistListEntry entries = 1; }

// IQ-test timing/scoring. All timing and the ding/question count live on the
// server; these client→server messages carry no count (the server is the sole
// owner of it — it initializes and doubles the count itself).
message IqStartCountdown   {}  // "player pressed Begin" — server uses its own stored count
message IqReadyForDing     {}  // "previous ding resolved, send the next one"
message IqCaught           {}  // "player pressed during a fake flash" — server doubles its count
// Sent right after the client restores a saved IQTestCountdownScreen/
// IQTestActiveScreen/FakeFlashCaughtScreen from a reconnect, so the server
// re-arms whatever it paused on disconnect once the client is actually ready
// to receive it (no-op if there's nothing paused for this player).
message IqResume           {}

message IqCountdownTick     { uint32 remaining = 1; }
message IqCountdownComplete {}
// fake: the flash has no real ding behind it. trap: the one-time catchable trap
// (pressing → penalty cutscene); a fake that is not a trap is a 50%-phase fake
// (pressing → fail). ding_count/total_dings are the server's authoritative counts,
// sent purely so the client can render them (counter, caught cutscene).
message IqDing              { bool fake = 1; bool trap = 2; uint32 ding_count = 3; uint32 total_dings = 4; }
message IqStartLoud         {}
message IqTestComplete      {}

message ServerMessage {
  oneof payload {
    StateUpdate          state_update            = 1;
    AuthChallenge        auth_challenge          = 3;
    AuthResult           auth_result             = 4;
    StateRequestRejected state_request_rejected  = 5;
    DistListResult       dist_list_result        = 6;
    DistStateEditPayload dist_state_edit_payload = 7;
    WinText              win_text                = 8;
    IqCountdownTick      iq_countdown_tick       = 9;
    IqCountdownComplete  iq_countdown_complete   = 10;
    IqDing               iq_ding                 = 11;
    IqStartLoud          iq_start_loud           = 12;
    IqTestComplete       iq_test_complete        = 13;
    StateUpdateAck          state_update_ack           = 14;
    DistRegisterAck         dist_register_ack          = 15;
    DistUploadAck           dist_upload_ack            = 16;
    DistCompleteAck         dist_complete_ack          = 17;
    DistStateEditSaveAck    dist_state_edit_save_ack   = 18;
    DistReplaceCompleteAck  dist_replace_complete_ack  = 19;
    DistUndeployAck         dist_undeploy_ack          = 20;
  }
}

message ClientMessage {
  oneof payload {
    StateUpdate       state_update       = 1;
    AuthResponse      auth_response      = 2;
    DistRegister      dist_register      = 3;
    DistUpload        dist_upload        = 4;
    StateRequest      state_request      = 5;
    DistUndeploy      dist_undeploy      = 6;
    DistList          dist_list          = 7;
    DistStateEdit        dist_state_edit       = 8;
    DistStateEditSave    dist_state_edit_save  = 9;
    DistComplete         dist_complete         = 10;
    DistReplaceComplete  dist_replace_complete = 11;
    IqStartCountdown     iq_start_countdown    = 12;
    IqReadyForDing       iq_ready_for_ding     = 13;
    IqCaught             iq_caught             = 14;
    IqResume             iq_resume             = 15;
  }
}
