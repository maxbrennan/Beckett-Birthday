syntax = "proto3";
package birthday;

enum AuthLevel {
  AUTH_LEVEL_NONE   = 0;
  AUTH_LEVEL_PLAYER = 1;
  AUTH_LEVEL_ADMIN  = 2;
}

message StateUpdate          { string json = 1; }
message StateUpdateAck       {}
message DistRegisterAck      { string upload_token = 1; }
message DistUploadAck        {}
message DistCompleteAck      {}
message DistStateEditSaveAck {}
message DistReplaceCompleteAck {}
message DistUndeployAck      {}
message WinText              { string text = 1; }
message TimerSync            { double timer_ends_at = 1; }
message TimedOut             {}
message AuthChallenge        { bytes challenge = 1; AuthLevel level = 2; }
message StateRequest         { string uuid = 1; }
message StateRequestRejected { string reason = 1; }

message PasswordAuthResponse {
  string username   = 1;
  string password   = 2;
  bytes  public_key = 3;
}

message KeyAuthResponse {
  string uuid               = 1;
  bytes  challenge_response = 2;
}

message AuthResponse {
  oneof method {
    PasswordAuthResponse password = 1;
    KeyAuthResponse      key      = 2;
  }
}

message PasswordAuthResult {
  bool      success = 1;
  AuthLevel level   = 2;
  string    uuid    = 3;
}

message KeyAuthResult {
  bool      success = 1;
  AuthLevel level   = 2;
}

message AuthResult {
  oneof result {
    PasswordAuthResult password = 1;
    KeyAuthResult      key      = 2;
  }
}

message DistRegister { string uuid = 1; string platform = 2; }
message DistUpload {
  string uuid        = 1;
  string filename    = 2;
  bytes  contents    = 3;
  uint32 chunk_index = 4;
  bool   is_last     = 5;
}
message DistUndeploy        { string uuid = 1; }
message DistList            {}
// iq_skip_offer_disabled: true if this build's config/app-config.json set
// iqSkipOfferEnabled to false at deploy time. Absent/false (protobufjs' default for
// an unset bool) means enabled -- see RegistryEntry.iqOfferDisabled and Server.elm's
// decideIqOffer, which is why this is phrased as the negative rather than mirroring
// the config file's positive "iqSkipOfferEnabled" name.
message DistComplete         { string uuid = 1; string filename = 2; string win_text = 3; repeated Question quiz_questions = 4; bool iq_skip_offer_disabled = 5; }
message DistStateEdit        { string uuid = 1; }
message DistStateEditSave    { string uuid = 1; string json = 2; }
message DistStateEditPayload { string uuid = 1; string json = 2; }
// quiz_questions/win_text/iq_skip_offer_disabled are resent fresh at replacement time, not
// inherited from the uuid being replaced -- unlike every other per-build field (state/iqTimer/
// quizProgress/timerEndsAt/iqOfferUsed), which the server carries forward from the old entry.
// See Server.elm's ClientDistReplaceComplete handler.
message DistReplaceComplete  { string new_uuid = 1; string old_uuid = 2; string filename = 3; repeated Question quiz_questions = 4; string win_text = 5; bool iq_skip_offer_disabled = 6; }

message DistListEntry {
  string uuid     = 1;
  string filename = 2;
  string platform = 3;
}
message DistListResult { repeated DistListEntry entries = 1; }

// IQ-test timing/scoring. All timing and the ding/question count live on the
// server; these client→server messages carry no count (the server is the sole
// owner of it — it initializes and doubles the count itself).
message IqStartCountdown   {}  // "player pressed Begin" — server uses its own stored count
message IqReadyForDing     {}  // "previous ding resolved, send the next one"
message IqCaught           {}  // "player pressed during a fake flash" — server doubles its count
// Sent right after the client restores a saved IQTestCountdownScreen/
// IQTestActiveScreen/FakeFlashCaughtScreen from a reconnect, so the server
// re-arms whatever it paused on disconnect once the client is actually ready
// to receive it (no-op if there's nothing paused for this player).
message IqResume           {}

message IqCountdownTick     { uint32 remaining = 1; }
message IqCountdownComplete {}
// fake: the flash has no real ding behind it. trap: the one-time catchable trap
// (pressing → penalty cutscene); a fake that is not a trap is a 50%-phase fake
// (pressing → fail). ding_count/total_dings are the server's authoritative counts,
// sent purely so the client can render them (counter, caught cutscene).
message IqDing              { bool fake = 1; bool trap = 2; uint32 ding_count = 3; uint32 total_dings = 4; }
message IqStartLoud         {}
message IqTestComplete      {}

// "A qualifying fail just happened" (DingWindowExpired timeout, or a SpaceBarPressed
// miss -- see Game.IQTest.decideSpaceBar's SpaceBarFailed case). No payload -- the
// server already owns dingCount/totalDings/phase for this uuid. See Server.elm's
// decideIqOffer / Model.iqOfferGrants.
message IqFailed {}

// "The player declined an outstanding skip offer." Releases the server-held grant
// (Model.iqOfferGrants) so a subsequent IqStartCountdown is no longer blocked -- see
// Server.elm's ClientIqStartCountdown handling. No payload: the server already knows
// which uuid/idx the outstanding grant is for.
message IqOfferDeclined {}

// The server's authoritative answer to "was the skip offer granted" for a fail (or a
// fake-flash catch). Sent once, synchronously, in reply to IqFailed and IqCaught alike
// -- see Server.elm's decideIqOffer. total_dings always carries the server's current
// totalDings (unchanged on a plain fail, already-doubled on a catch).
message IqOfferDecision { bool granted = 1; uint32 total_dings = 2; }

// One quiz slide's accepted answers. Carried only on DistComplete/DistReplaceComplete (the
// deploy-time, client->server ingress) -- never on any server->client message, since answers
// must never reach the client (see #54/#70).
message Question { repeated string answers = 1; }

// "I just passed question idx" (correct answer, or an IQ-test penalty
// clearing after a wrong one). The server, not this message, decides whether
// this means the game is won -- see Server.elm's acceptQuizAdvance/
// quizJustCompleted.
message QuizAdvanced { uint32 idx = 1; }

// "I typed this answer for question idx" -- the server validates it against the connecting
// player's own build's quiz_questions (sent at deploy time on DistComplete/
// DistReplaceComplete, stored on that build's RegistryEntry; never sent to the client) and
// replies with QuizAnswerResult. See Game.Quiz.decideAnswer / Server.elm's handling of
// ClientQuizAnswerSubmitted.
message QuizAnswerSubmitted { uint32 idx = 1; string answer = 2; }

// correct: whether the answer matched. reveal_answer: the correct answer's
// display text, populated only when correct = false (see WrongAnswerScreen).
message QuizAnswerResult { uint32 idx = 1; bool correct = 2; string reveal_answer = 3; }

// "The song/video for question idx just finished playing." The server tracks this
// per-uuid (in memory only) and requires it to match before accepting a submitted
// answer for the same idx -- see Server.elm's ClientQuizSongEnded / the
// ClientQuizAnswerSubmitted gate.
message QuizSongEnded    { uint32 idx = 1; }
message QuizSongEndedAck { uint32 idx = 1; }

message ServerMessage {
  oneof payload {
    StateUpdate          state_update            = 1;
    AuthChallenge        auth_challenge          = 3;
    AuthResult           auth_result             = 4;
    StateRequestRejected state_request_rejected  = 5;
    DistListResult       dist_list_result        = 6;
    DistStateEditPayload dist_state_edit_payload = 7;
    WinText              win_text                = 8;
    IqCountdownTick      iq_countdown_tick       = 9;
    IqCountdownComplete  iq_countdown_complete   = 10;
    IqDing               iq_ding                 = 11;
    IqStartLoud          iq_start_loud           = 12;
    IqTestComplete       iq_test_complete        = 13;
    StateUpdateAck          state_update_ack           = 14;
    DistRegisterAck         dist_register_ack          = 15;
    DistUploadAck           dist_upload_ack            = 16;
    DistCompleteAck         dist_complete_ack          = 17;
    DistStateEditSaveAck    dist_state_edit_save_ack   = 18;
    DistReplaceCompleteAck  dist_replace_complete_ack  = 19;
    DistUndeployAck         dist_undeploy_ack          = 20;
    TimerSync               timer_sync                 = 21;
    TimedOut                timed_out                  = 22;
    QuizAnswerResult        quiz_answer_result         = 23;
    QuizSongEndedAck        quiz_song_ended_ack        = 24;
    IqOfferDecision         iq_offer_decision          = 25;
  }
}

message ClientMessage {
  oneof payload {
    StateUpdate       state_update       = 1;
    AuthResponse      auth_response      = 2;
    DistRegister      dist_register      = 3;
    DistUpload        dist_upload        = 4;
    StateRequest      state_request      = 5;
    DistUndeploy      dist_undeploy      = 6;
    DistList          dist_list          = 7;
    DistStateEdit        dist_state_edit       = 8;
    DistStateEditSave    dist_state_edit_save  = 9;
    DistComplete         dist_complete         = 10;
    DistReplaceComplete  dist_replace_complete = 11;
    IqStartCountdown     iq_start_countdown    = 12;
    IqReadyForDing       iq_ready_for_ding     = 13;
    IqCaught             iq_caught             = 14;
    IqResume             iq_resume             = 15;
    QuizAdvanced         quiz_advanced         = 16;
    QuizAnswerSubmitted  quiz_answer_submitted = 17;
    QuizSongEnded        quiz_song_ended       = 18;
    IqFailed             iq_failed             = 19;
    IqOfferDeclined      iq_offer_declined     = 20;
  }
}
