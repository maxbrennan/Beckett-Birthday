name: CI

on:
  pull_request:
    branches: [main]

jobs:
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: 'npm'
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y xvfb ffmpeg
      - run: npm run build
      - run: xvfb-run --auto-servernum npm run test:integration:js
      - run: xvfb-run --auto-servernum npm run test:gui

  js-unit:
    name: JS Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:unit:js
      - uses: actions/upload-artifact@v4
        with:
          name: js-coverage-data
          path: coverage/js
          retention-days: 7

  elm-unit:
    name: Elm Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:elm
      - uses: actions/upload-artifact@v4
        with:
          name: elm-coverage-data
          path: .coverage
          retention-days: 7
          include-hidden-files: true

  js-coverage:
    name: JS Coverage
    needs: js-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: 'npm'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: js-coverage-data
          path: coverage/js
      # Interim floor, not the 95% target from issue #26 — raised from 5% after #48's
      # testability refactor of bridge.js/server/index.js/scripts; see the follow-up
      # issue tracking Main.elm's update-logic extraction for the remaining gap.
      - run: node ci/check-js-coverage.js 15

  elm-coverage:
    name: Elm Coverage
    needs: elm-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: 'npm'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: elm-coverage-data
          path: .coverage
      # Meets the 95% target from issue #26 — raised from 50% after #57 also closed
      # out Server.elm/Sync.elm/Game.IQTest's remaining gaps (measured ~98% with
      # View.elm's Html-rendering functions excluded, see ci/check-elm-coverage.js).
      # The residual ~2% is genuinely unreachable via elm-test: Task.perform/port
      # callbacks only invoked by the real runtime, Platform.worker/Browser.element
      # program wiring (init/subscriptions/main), and one provably-dead decode
      # fallback branch — see the comments at each site in Main.elm/Server.elm.
      - run: node ci/check-elm-coverage.js 95
